<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            border:1px solid black;
            background-color:rgb(255, 196, 196);
            font-size:30px;
            justify-content:center;
        }
         .container1{
            display:grid;
            border:1px solid black;
            background-color:rgb(255, 196, 196);
            font-size:30px;
            justify-content:space-between;
         }
        .container div{
            background-color:rgb(4,192,244);
            border:1px solid black;
            padding:20px;
            text-align:center;
        }
        .container1 div{
            background-color:rgb(4,192,244);
            border:1px solid black;
            padding:20px;
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
    <div class="container1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
    <div class="container2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>
</html>
