<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid black;
           width:300px;
            margin: auto;
            border: 1px solid red;
            background-color: rgb(4, 192, 244);
            text-align: center;
            
        }
    </style>
</head>
<body>
    <h2>Using individual margin properties</h2>
    <div>
        <p>This div element has a top margin of 100px. a right margin of 150px. a bottom margin of 100px, and a left margin of 80px.</p>
    </div>
</body>
</html>
